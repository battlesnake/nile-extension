<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Amazon.com : 1TB SATA SSD</title></head>
<body>
  <header>
    <form>
      <input type="text" id="twotabsearchtextbox" value="1TB SATA SSD">
    </form>
  </header>

  <div class="s-main-slot s-result-list s-search-results">

    <!-- KEEP: has 1TB, SATA, SSD -->
    <div data-asin="B0EVO1TB01" data-component-type="s-search-result" class="s-result-item">
      <div class="s-card-container"><div data-cy="title-recipe">
        <h2 class="a-size-base-plus a-color-base a-text-normal">
          <span>Samsung 870 EVO 1TB SATA III 2.5&quot; Internal SSD</span>
        </h2>
      </div><div class="s-price">$99.99</div></div>
    </div>

    <!-- KEEP: 1TB, SATA, SSD (with hyphen/inch noise) -->
    <div data-asin="B0MX500TB2" data-component-type="s-search-result" class="s-result-item">
      <div class="s-card-container"><div data-cy="title-recipe">
        <h2 class="a-size-base-plus a-color-base a-text-normal">
          <span>Crucial MX500 1TB 3D NAND SATA 2.5-inch SSD</span>
        </h2>
      </div><div class="s-price">$79.99</div></div>
    </div>

    <!-- KEEP via data-size equivalence: 1000GB == 1TB -->
    <div data-asin="B0SEAG1000" data-component-type="s-search-result" class="s-result-item">
      <div class="s-card-container"><div data-cy="title-recipe">
        <h2 class="a-size-base-plus a-color-base a-text-normal">
          <span>Seagate BarraCuda 1000GB SATA Internal SSD</span>
        </h2>
      </div><div class="s-price">$84.00</div></div>
    </div>

    <!-- GREY: missing 1TB (it's 512GB) -->
    <div data-asin="B0SAND512G" data-component-type="s-search-result" class="s-result-item">
      <div class="s-card-container"><div data-cy="title-recipe">
        <h2 class="a-size-base-plus a-color-base a-text-normal">
          <span>SanDisk SSD Plus 512GB SATA III 2.5&quot; SSD</span>
        </h2>
      </div><div class="s-price">$39.99</div></div>
    </div>

    <!-- GREY: missing SATA (it's USB) -->
    <div data-asin="B0WDBLUUSB" data-component-type="s-search-result" class="s-result-item">
      <div class="s-card-container"><div data-cy="title-recipe">
        <h2 class="a-size-base-plus a-color-base a-text-normal">
          <span>WD Blue 1TB USB 3.0 Portable External SSD</span>
        </h2>
      </div><div class="s-price">$109.99</div></div>
    </div>

  </div>
</body>
</html>
