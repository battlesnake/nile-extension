<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a37f"/><stop offset="1" stop-color="#0a5f4e"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>

  <!-- header: logo + wordmark -->
  <g transform="translate(36,30)">
    <rect width="54" height="54" rx="14" fill="#ffffff" opacity="0.16"/>
    <path d="M17 42 V15 L37 42 V15" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="39" font-size="33" font-weight="700" fill="#fff">Nile</text>
  </g>

  <!-- concept: one kept, one greyed -->
  <g transform="translate(36,114)">
    <rect x="0" y="0" width="368" height="44" rx="10" fill="#ffffff" opacity="0.96"/>
    <circle cx="23" cy="22" r="7" fill="#0e7c66"/>
    <text x="41" y="28" font-size="16.5" font-weight="600" fill="#14211d">Samsung 1TB SATA SSD</text>

    <rect x="0" y="56" width="368" height="44" rx="10" fill="#ffffff" opacity="0.28"/>
    <circle cx="23" cy="78" r="7" fill="#ffffff" opacity="0.45"/>
    <text x="41" y="84" font-size="16.5" fill="#eafaf4" opacity="0.72">512GB SATA SSD</text>
  </g>

  <text x="36" y="246" font-size="14.5" fill="#d3f0e6">Search “1TB SATA SSD” — the 512GB is greyed out.</text>
</svg>
